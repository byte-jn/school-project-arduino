# Mosquitto-Konfiguration für die Laptop-Kühlung.
# Ohne "listener" nimmt Mosquitto 2.x nur Verbindungen aus dem Container selbst an.
# Von außen ist der Broker trotzdem nur über 127.0.0.1 erreichbar (siehe docker-compose.yml).
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
